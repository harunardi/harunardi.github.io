    Di episode ini, kami ngobrol dengan Dr. Muhammad Rifai, M.Eng., kepala Pusat Riset Teknologi Akselerator (PRTA) ORTN-BRIN
    Akselerator memiliki potensi yang besar di Indonesia. Di sisi praktis, akselerator bisa digunakan untuk memproduksi radioisotop yang penting kebutuhan manusia, seperti radioisotop medis. Di sisi riset, terdapat begitu banyak lesson learned yang bisa didapat bila Indonesia mampu membangun akselerator sendiri. Kami ngobrol tentang rencana jangka pendek, menengah, dan panjang dari PRTA
