  title: "The Meitner Project dan Nuklir di Cambridge"
  description: >
    Di episode ini, kami ngobrol dengan Alya Jasmine, mahasiswa S2 di bidang Nuclear Energy di University of Cambridge. Alya terpapar tentang pentingnya nuklir sejak SMA, dan selalu ingin bergerak untuk mengkampanyekan nuklir serta meluruskan miskonsepsinya. Hingga akhirnya dia membuat The Meitner Project, sebuah proyek kampanye nuklir yang terinspirasi oleh Lisa Meitner. Kami ngobrol tentang ketertarikannya terhadap nuklir, bagaimana “skena” nuklir di Britania Raya, dan alasannya membuat The Meitner Project.
